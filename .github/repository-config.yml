version: 1
requiredStatusChecks:
  - pr (ubuntu-24.04)
  - pr (ubuntu-24.04-arm)
  - pr (macos-26)
  - pr (windows-2025)
  - pr (windows-11-arm)
settings:
  description: About View for LVCE Editor
  homepage: https://lvce-editor.github.io/about-view/
  has_wiki: true
  has_projects: true
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  allow_auto_merge: true
  delete_branch_on_merge: true
topics:
  - about
  - editor
  - lvce-editor
labels:
  - name: repository-config
    color: '5319e7'
    description: Changes to GitHub repository configuration
milestones: []
branches:
  - name: main
    protection:
      enforce_admins: true
      required_signatures: false
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: false
        require_code_owner_reviews: false
        require_last_push_approval: false
rulesets:
  - name: Protect release tags
    target: tag
    enforcement: active
    conditions:
      ref_name:
        include: ['refs/tags/v*']
        exclude: []
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always
    rules:
      - type: deletion
      - type: non_fast_forward
